name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build same-origin BOM weather feed
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import urllib.request

          url = "https://www.bom.gov.au/fwo/IDV60901/IDV60901.95936.json"
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          out = {
              "source": "BOM",
              "station": "Melbourne (Olympic Park)",
              "status": "unavailable",
              "generated_at": now,
              "temp": None,
              "humidity": None,
              "direction": None,
              "speed": None,
              "rain": None,
          }

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Clock09-GitHub-Pages/1.0",
                      "Accept": "application/json,text/plain,*/*",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              rows = payload.get("observations", {}).get("data", [])
              if rows:
                  row = rows[0]
                  out.update({
                      "status": "live",
                      "station": row.get("name") or "Melbourne (Olympic Park)",
                      "temp": row.get("air_temp"),
                      "humidity": row.get("rel_hum"),
                      "direction": row.get("wind_dir"),
                      "speed": row.get("wind_spd_kmh"),
                      "rain": row.get("rain_trace"),
                      "observed_at": row.get("aifstime_utc") or row.get("local_date_time_full"),
                  })
          except Exception as exc:
              out["error"] = str(exc)[:180]

          with open("weather.json", "w", encoding="utf-8") as handle:
              json.dump(out, handle, ensure_ascii=False, separators=(",", ":"))
          print(json.dumps(out, ensure_ascii=False))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
