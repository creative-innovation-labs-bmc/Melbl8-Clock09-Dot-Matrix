<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Clock 09 Dot Matrix B</title>
  <style>
    :root { --bg:#373A36; --white:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--white); font-family:Arial, Helvetica, sans-serif; overflow:hidden; }
    body { display:grid; place-items:center; }
    .shell { width:100vw; height:100vh; display:grid; place-items:center; }
    .stage { position:relative; width:min(100vw, calc(100vh * 4.776119403)); height:min(100vh, calc(100vw / 4.776119403)); aspect-ratio:3840/804; background:var(--bg); overflow:hidden; }
    canvas { position:absolute; inset:0; width:100%; height:100%; }
    .overlay { position:absolute; inset:0; pointer-events:none; }
    .version { position:absolute; top:24px; left:36px; font-size:20px; letter-spacing:.22em; color:rgba(255,255,255,.72); text-transform:uppercase; }
    .footer { position:absolute; left:40px; right:40px; bottom:26px; display:flex; justify-content:space-between; gap:20px; font-size:24px; letter-spacing:.18em; color:rgba(255,255,255,.9); text-transform:uppercase; }
  </style>
</head>
<body>
  <div class="shell"><div class="stage"><canvas id="clock-canvas"></canvas><div class="overlay"><div class="version" data-version-tag></div><div class="footer"><div data-footer-left></div><div data-footer-right></div></div></div></div></div>
  <script src="./clock-variants.js"></script>
  <script>
    DotMatrixClock.createClock({
      title:'Version B · Kinetic Wave',
      cols:96,
      rows:24,
      pulseColon:true,
      twinkle:true,
      scan:false,
      wave:true,
      digitGlow:0.32,
      idleAlpha:0.11,
      progressAlpha:0.18,
      sweepStrength:0.10
    });
  </script>
</body>
</html>
