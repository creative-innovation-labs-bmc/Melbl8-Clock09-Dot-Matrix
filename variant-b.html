<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#373A36">
  <title>Clock 09 Dot Matrix B</title>
  <style>
    @font-face{font-family:'Open Sans';src:url('https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock03-Split-flap-Open-Sans/main/OpenSans-Variable.ttf') format('truetype');font-style:normal;font-weight:300 800;font-display:swap}
    :root{--bg:#373A36;--text:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Open Sans',sans-serif;overflow:hidden}body{display:grid;place-items:center}.shell{width:100vw;height:100vh;display:grid;place-items:center;background:var(--bg)}.stage{position:relative;width:min(100vw,calc(100vh * 3840 / 804));height:min(100vh,calc(100vw * 804 / 3840));aspect-ratio:3840/804;overflow:hidden;background:var(--bg)}canvas{position:absolute;inset:0;width:100%;height:100%}.overlay{position:absolute;inset:0;pointer-events:none}.version{position:absolute;top:.5vw;left:1vw;font-size:clamp(4px,.47vw,18px);letter-spacing:.18em;color:rgba(255,255,255,.48);text-transform:uppercase}.footer{position:absolute;left:1vw;right:1vw;bottom:.47vw;display:flex;justify-content:space-between;gap:1vw;font-size:clamp(5px,.57vw,22px);letter-spacing:.16em;color:rgba(255,255,255,.88);text-transform:uppercase}
  </style>
</head>
<body><div class="shell"><div class="stage"><canvas id="clock-canvas"></canvas><div class="overlay"><div class="version" data-version-tag></div><div class="footer"><div data-footer-left></div><div data-footer-right></div></div></div></div></div><script src="./clock-variants.js"></script><script>DotMatrixClock.createClock({title:'Version B · Dense Kinetic',cols:168,rows:32,glyphScale:2,idleAlpha:0.065,progressAlpha:0.10,activeAlpha:0.96,rippleAlpha:0.11,rippleScale:0.075,scan:0.0,twinkle:0.012});</script></body></html>
