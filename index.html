<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#373A36">
  <title>Melbourne Dot Matrix Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="clock" class="clock" aria-label="Melbourne time">
    <div id="field" class="field" aria-hidden="true"></div>

    <section class="time-wrap" aria-live="off">
      <div id="time" class="time-grid" aria-label="Current time"></div>
    </section>

    <footer class="meta">
      <div class="location">MELBOURNE, AUSTRALIA</div>
      <div id="date" class="date"></div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
