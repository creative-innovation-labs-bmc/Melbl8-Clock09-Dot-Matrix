<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#373A36">
  <title>Clock 09 Dot Matrix</title>
  <style>
    :root{--bg:#373A36;--text:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    body{display:grid;place-items:center}
    .shell{width:100vw;height:100vh;display:grid;place-items:center;background:var(--bg)}
    .stage{position:relative;width:100vw;aspect-ratio:3840/804;max-height:100vh;overflow:hidden;background:var(--bg)}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .overlay{position:absolute;inset:0;pointer-events:none}
    .version{position:absolute;top:20px;left:36px;font-size:18px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}
    .footer{position:absolute;left:38px;right:38px;bottom:18px;display:flex;justify-content:space-between;gap:20px;font-size:22px;letter-spacing:.16em;color:rgba(255,255,255,.88);text-transform:uppercase}
  </style>
</head>
<body>
<div class="shell"><div class="stage"><canvas id="clock-canvas"></canvas><div class="overlay"><div class="version" data-version-tag></div><div class="footer"><div data-footer-left></div><div data-footer-right></div></div></div></div></div>
<script src="./clock-variants.js"></script>
<script>DotMatrixClock.createClock({title:'Version A · Integrated Grid',cols:156,rows:30,idleAlpha:0.075,progressAlpha:0.115,activeAlpha:0.94,rippleAlpha:0.08,rippleScale:0.05,scan:0.04,twinkle:0.01});</script>
</body>
</html>
